
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eaf3ff">
<title>School Buddy.</title>

<style>
:root {
  --bg: #eaf3ff;
  --bg2: #f5f8ff;
  --white: rgba(255,255,255,.78);
  --white-solid: #ffffff;
  --text: #202b45;
  --muted: #78849d;
  --purple: #8875ef;
  --purple-light: #eeeaff;
  --blue: #8ebcf5;
  --line: rgba(133,151,190,.16);
  --shadow: 0 12px 35px rgba(94,125,180,.10);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont,
    "Helvetica Neue", Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse at 15% 5%, #ffffff 0%, transparent 38%),
    radial-gradient(ellipse at 90% 30%, #d9eaff 0%, transparent 42%),
    linear-gradient(135deg, #eaf3ff, #f5f6ff 55%, #e5f0ff);
  overflow-x: hidden;
}

/* 起動アニメーション */


.splash {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: #080a12;
  color: white;
  clip-path: inset(0);
  transition: clip-path 1.15s cubic-bezier(.76,0,.24,1);
}

.splash::before {
  content: "";
  position: absolute;
  width: 55vw;
  height: 55vw;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(145,125,255,.38),
    rgba(100,170,255,.13) 45%,
    transparent 70%);
  filter: blur(25px);
  animation: glowMove 2s ease-in-out infinite alternate;
}

.splash-logo {
  position: relative;
  z-index: 2;
  font-size: clamp(32px,5vw,58px);
  font-weight: 750;
  letter-spacing: -2px;
  animation: premiumLogo 1.5s cubic-bezier(.2,.8,.2,1) both;
}

.splash-logo span {
  color: #a998ff;
}

.splash.leaving {
  clip-path: inset(0 0 100% 0 round 0 0 45% 45%);
  pointer-events: none;
}

@keyframes premiumLogo {
  0% {
    opacity: 0;
    transform: scale(.78) translateY(20px);
    filter: blur(12px);
  }
  45% { opacity: 1; filter: blur(0); }
  75% { transform: scale(1.06); }
  100% { opacity: 1; transform: scale(1); }
}

@keyframes glowMove {
  from { transform: translate(-12%,-8%) scale(.8); }
  to { transform: translate(12%,8%) scale(1.2); }
}


.app {
  width: min(1600px, 100%);
  margin: auto;
  padding: 20px 42px 40px;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity .65s ease, transform .65s ease;
}

.app.ready {
  opacity: 1;
  transform: translateY(0);
}

/* ヘッダー */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 24px;
}

.brand {
  font-size: 29px;
  font-weight: 780;
  letter-spacing: -1.3px;
}

.brand span {
  color: var(--purple);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}

.language-select {
  border: 1px solid var(--line);
  background: rgba(255,255,255,.72);
  color: var(--text);
  border-radius: 30px;
  padding: 12px 17px;
  font: inherit;
  font-size: 14px;
  outline: none;
  box-shadow: 0 5px 18px rgba(80,110,160,.06);
}

.profile-button {
  width: 47px;
  height: 47px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: rgba(255,255,255,.8);
  color: var(--text);
  font-size: 22px;
  cursor: pointer;
}

/* ナビゲーション */

.nav {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  padding: 9px;
  margin-bottom: 28px;
  border: 1px solid rgba(255,255,255,.9);
  border-radius: 28px;
  background: rgba(255,255,255,.58);
  backdrop-filter: blur(24px);
  box-shadow: var(--shadow);
}

.nav button {
  border: 0;
  border-radius: 22px;
  padding: 15px 10px;
  background: transparent;
  color: #56627d;
  font: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background .25s, color .25s, transform .25s;
}

.nav button:hover {
  background: rgba(255,255,255,.8);
  transform: translateY(-1px);
}

.nav button.active {
  color: #725ce3;
  background: linear-gradient(135deg,#eeeaff,#e3e9ff);
}

.nav-icon {
  margin-right: 7px;
  font-size: 18px;
}

/* メイン */

.hero {
  position: relative;
  overflow: hidden;
  min-height: 195px;
  padding: 30px 36px;
  margin-bottom: 25px;
  border: 1px solid rgba(255,255,255,.85);
  border-radius: 34px;
  background: linear-gradient(115deg,
    rgba(255,255,255,.86),
    rgba(222,235,255,.8));
  box-shadow: var(--shadow);
}

.hero::before,
.hero::after {
  content: "";
  position: absolute;
  pointer-events: none;
  border-radius: 50%;
}

.hero::before {
  width: 430px;
  height: 230px;
  right: -70px;
  bottom: -155px;
  background: linear-gradient(130deg,
    rgba(132,180,255,.25),
    rgba(164,146,255,.25));
  transform: rotate(-18deg);
}

.hero::after {
  width: 330px;
  height: 170px;
  right: 110px;
  bottom: -145px;
  background: rgba(255,255,255,.38);
  transform: rotate(-22deg);
}

.hero-content {
  position: relative;
  z-index: 1;
}

.hero-label {
  color: #826de9;
  font-size: 13px;
  font-weight: 750;
  letter-spacing: 1.2px;
}

.hero h1 {
  margin: 12px 0 8px;
  font-size: clamp(27px,3vw,39px);
  letter-spacing: -1.3px;
}

.hero p {
  margin: 0;
  color: var(--muted);
  font-size: 17px;
}

/* ホームカード */

.home-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}


.card {
  min-width: 0;
  padding: 25px;
  border: 1px solid rgba(255,255,255,.95);
  border-radius: 31px;
  background: var(--white);
  backdrop-filter: blur(22px);
  box-shadow: var(--shadow);
}

.home-grid .card:first-child {
  opacity: 0;
  transform: translateX(-35px);
}

.home-grid .card:last-child {
  opacity: 0;
  transform: translateX(35px);
}

.app.ready .home-grid .card:first-child {
  animation: revealLeft .9s .55s cubic-bezier(.2,.8,.2,1) both;
}

.app.ready .home-grid .card:last-child {
  animation: revealRight .9s .72s cubic-bezier(.2,.8,.2,1) both;
}
.text-link {
  border: 0;
  background: transparent;
  color: #8068ec;
  font: inherit;
  font-weight: 650;
  cursor: pointer;
}

/* 時間割 */

.period {
  display: grid;
  grid-template-columns: 54px 1fr auto;
  align-items: center;
  gap: 15px;
  padding: 9px 12px;
  margin-bottom: 7px;
  border-radius: 15px;
  background: rgba(244,247,255,.72);
  transition: transform .2s, background .2s;
}

.period:hover {
  transform: translateX(3px);
  background: white;
}

.period-number {
  display: grid;
  place-items: center;
  width: 48px;
  height: 37px;
  border-radius: 12px;
  font-size: 17px;
  font-weight: 750;
}

.period:nth-child(2) .period-number { background:#ffe0eb; color:#b64c79; }
.period:nth-child(3) .period-number { background:#dceaff; color:#386ab8; }
.period:nth-child(4) .period-number { background:#ddf5e6; color:#32845b; }
.period:nth-child(5) .period-number { background:#fff0ce; color:#a47728; }
.period:nth-child(6) .period-number { background:#e9e0ff; color:#7557c7; }
.period:nth-child(7) .period-number { background:#dceeff; color:#367bc1; }

.subject {
  font-size: 16px;
  font-weight: 650;
}

.period-time {
  color: #65718c;
  font-size: 14px;
  white-space: nowrap;
}

/* 課題 */

.task {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 15px 5px;
  border-bottom: 1px solid var(--line);
  font-size: 16px;
}

.task:last-child {
  border-bottom: 0;
}

.task input {
  appearance: none;
  flex-shrink: 0;
  width: 23px;
  height: 23px;
  border: 2px solid #aeb9d0;
  border-radius: 7px;
  background: white;
  cursor: pointer;
}

.task input:checked {
  border-color: var(--purple);
  background: var(--purple);
}

.task input:checked::after {
  content: "✓";
  display: block;
  color: white;
  text-align: center;
  line-height: 19px;
  font-weight: bold;
}

.task span {
  flex: 1;
}

.task.done span {
  color: #929bad;
  text-decoration: line-through;
}

.add-button {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  color: #785fe5;
  background: #eeeaff;
  font-size: 24px;
  cursor: pointer;
}

/* 各ページ */

.page {
  display: none;
  animation: pageIn .35s ease both;
}

.page.active {
  display: block;
}

@keyframes pageIn {
  from { opacity: 0; transform: translateY(7px); }
  to { opacity: 1; transform: translateY(0); }
}

.page-heading {
  margin: 5px 0 22px;
  font-size: 30px;
}

.page-description {
  margin-top: -12px;
  margin-bottom: 25px;
  color: var(--muted);
}

.ai-box {
  min-height: 430px;
  display: flex;
  flex-direction: column;
}

.chat-messages {
  flex: 1;
  min-height: 270px;
  padding: 20px;
  border-radius: 22px;
  background: rgba(246,248,255,.8);
  overflow-y: auto;
}

.message {
  max-width: 80%;
  padding: 14px 17px;
  margin-bottom: 12px;
  border-radius: 18px;
  line-height: 1.65;
  white-space: pre-wrap;
}

.message.buddy {
  background: #eeeaff;
  border-bottom-left-radius: 5px;
}

.message.user {
  margin-left: auto;
  background: #e0edff;
  border-bottom-right-radius: 5px;
}

.chat-form {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.chat-form input {
  flex: 1;
  min-width: 0;
  padding: 16px 19px;
  border: 1px solid var(--line);
  border-radius: 30px;
  background: white;
  font: inherit;
  outline: none;
}

.send-button {
  width: 53px;
  height: 53px;
  border: 0;
  border-radius: 50%;
  background: var(--purple);
  color: white;
  font-size: 21px;
  cursor: pointer;
}

.send-button:disabled {
  opacity: .5;
  cursor: wait;
}

.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 18px 0;
  border-bottom: 1px solid var(--line);
}

.settings-row select {
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: white;
  color: var(--text);
  font: inherit;
}

footer {
  padding: 25px 0 5px;
  text-align: center;
  color: #96a2b9;
  font-size: 12px;
}

/* iPad・スマホ */

@media (max-width: 760px) {
  .app { padding: 16px; }
  .home-grid { grid-template-columns: 1fr; }
  .nav { gap: 3px; padding: 6px; }
  .nav button { padding: 12px 5px; font-size: 12px; }
  .nav-icon { display: block; margin: 0 0 4px; }
  .hero { padding: 24px; }
  .card { padding: 19px; }
  .card-title { font-size: 19px; }
}

@media (max-width: 430px) {
  .brand { font-size: 23px; }
  .header { gap: 8px; }
  .language-select { max-width: 125px; padding: 10px; }
  .profile-button { width: 40px; height: 40px; }
  .hero h1 { font-size: 26px; }
  .hero p { font-size: 14px; }
  .period { grid-template-columns: 43px 1fr auto; gap: 9px; }
  .period-number { width: 39px; }
  .period-time { font-size: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

  <!-- HOME -->
  <main class="page active" id="page-home">

    <section class="hero">

      <section class="card">

          <h2 class="card-title">
            <span class="card-icon">☑</span>
            <span data-i18n="todayTasks">今日の課題</span>
          </h2>

        </div>

        <div id="homeTasks"></div>
      </section>

    </div>
  </main>

  <!-- AI BUDDY -->
  <section class="page" id="page-ai">
    <h1 class="page-heading">✦ AI Buddy</h1>
    <p class="page-description" data-i18n="aiDescription">
      勉強や学校生活について、何でも相談してね。
    </p>

    <div class="card ai-box">
      <div class="chat-messages" id="chatMessages">
        <div class="message buddy" data-i18n="welcome">
          こんにちは！Buddyだよ。何でも聞いてね ✨
        </div>
      </div>

      <form class="chat-form" id="chatForm">
        <input id="question" type="text"
          data-i18n-placeholder="askPlaceholder"
          placeholder="Buddyに質問してみよう..." autocomplete="off">
        <button class="send-button" id="sendButton"
          type="submit" aria-label="Send">➤</button>
      </form>
    </div>
  </section>

  <!-- SCHEDULE -->
  <section class="page" id="page-schedule">
    <h1 class="page-heading" data-i18n="todaySchedule">今日の時間割</h1>
    <p class="page-description" data-i18n="scheduleDescription">
      今日の授業を確認しよう。
    </p>
    <div class="card">
      <div id="fullSchedule"></div>
    </div>
  </section>

  <!-- TASKS -->
  <section class="page" id="page-tasks">
    <h1 class="page-heading" data-i18n="todayTasks">今日の課題</h1>
    <p class="page-description" data-i18n="tasksDescription">
      やることをひとつずつ進めよう。
    </p>
    <div class="card">
      <div id="fullTasks"></div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section class="page" id="page-settings">
    <h1 class="page-heading" data-i18n="settings">設定</h1>
    <div class="card">
      <div class="settings-row">
        <strong data-i18n="language">表示言語</strong>
        <select id="languageSelect2">
          <option value="ja">日本語</option>
          <option value="en">English</option>
          <option value="ko">한국어</option>
          <option value="zh">中文</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="de">Deutsch</option>
          <option value="pt">Português</option>
        </select>
      </div>
      <div class="settings-row">
        <strong data-i18n="motion">アニメーション</strong>
        <span data-i18n="motionNote">端末の設定に合わせます</span>
      </div>
      <div class="settings-row">
        <strong>School Buddy.</strong>
        <span>Version 2.0</span>
      </div>
    </div>
  </section>

  <footer>School Buddy. © 2026</footer>
</div>

/* --------------------------------
   サンプル時間割・課題
-------------------------------- */

const times = [
  ["8:45 – 9:30", "9:40 – 10:25"],
  ["10:35 – 11:20", "11:30 – 12:15"],
  ["13:05 – 13:50", "14:00 – 14:45"]
];

const periods = [
  {number:1, time:"8:45 – 9:30", subject:0},
  {number:2, time:"9:40 – 10:25", subject:1},
  {number:3, time:"10:35 – 11:20", subject:2},
  {number:4, time:"11:30 – 12:15", subject:3},
  {number:5, time:"13:05 – 13:50", subject:4},
  {number:6, time:"14:00 – 14:45", subject:5}
];

let tasks = [
  {id:1, key:0, done:true},
  {id:2, key:1, done:false},
  {id:3, key:2, done:false},
  {id:4, key:3, done:false}
];

let currentLanguage = localStorage.getItem("schoolBuddyLanguage") || "ja";
if (!translations[currentLanguage]) currentLanguage = "ja";

/* --------------------------------
   表示
-------------------------------- */

function t(key) {
  return translations[currentLanguage][key] || translations.ja[key] || key;
}

function renderSchedule(targetId) {
  const target = document.getElementById(targetId);
  target.innerHTML = "";

  periods.forEach(period => {
    const row = document.createElement("div");
    row.className = "period";

    const number = document.createElement("div");
    number.className = "period-number";
    number.textContent = period.number;

    const subject = document.createElement("div");
    subject.className = "subject";
    subject.textContent = t("subjects")[period.subject];

    const time = document.createElement("div");
    time.className = "period-time";
    time.textContent = period.time;

    row.append(number, subject, time);
    target.appendChild(row);
  });
}

function renderTasks(targetId) {
  const target = document.getElementById(targetId);
  target.innerHTML = "";

  tasks.forEach(task => {
    const row = document.createElement("label");
    row.className = "task" + (task.done ? " done" : "");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.done;
    checkbox.addEventListener("change", () => {
      task.done = checkbox.checked;
      renderAll();
    });

    const name = document.createElement("span");
    name.textContent = t("taskNames")[task.key] || task.customName;

    row.append(checkbox, name);
    target.appendChild(row);
  });
}

function renderAll() {
  renderSchedule("homeSchedule");
  renderSchedule("fullSchedule");
  renderTasks("homeTasks");
  renderTasks("fullTasks");
}

function changeLanguage(language) {
  currentLanguage = translations[language] ? language : "ja";
  localStorage.setItem("schoolBuddyLanguage", currentLanguage);

  document.documentElement.lang = currentLanguage;
  document.getElementById("languageSelect").value = currentLanguage;
  document.getElementById("languageSelect2").value = currentLanguage;

  document.querySelectorAll("[data-i18n]").forEach(element => {
    const key = element.dataset.i18n;
    element.textContent = t(key);
  });

  document.querySelectorAll("[data-i18n-placeholder]").forEach(element => {
    element.placeholder = t(element.dataset.i18nPlaceholder);
  });

  renderAll();
}

/* --------------------------------
   ページ切り替え
-------------------------------- */

function showPage(pageName) {
  document.querySelectorAll(".page").forEach(page => {
    page.classList.remove("active");
  });

  const target = document.getElementById("page-" + pageName);
  if (target) target.classList.add("active");

  document.querySelectorAll(".nav button").forEach(button => {
    button.classList.toggle("active", button.dataset.page === pageName);
  });

  window.scrollTo({top:0, behavior:"smooth"});
}

document.querySelectorAll(".nav button").forEach(button => {
  button.addEventListener("click", () => showPage(button.dataset.page));
});

document.querySelectorAll("[data-go]").forEach(button => {
  button.addEventListener("click", () => showPage(button.dataset.go));
});

/* --------------------------------
   課題追加（この画面内の一時データ）
-------------------------------- */

document.getElementById("addTask").addEventListener("click", () => {
  const name = prompt(t("enterTask"));
  if (!name || !name.trim()) return;

  tasks.push({
    id: Date.now(),
    key: -1,
    customName: name.trim(),
    done: false
  });

  renderAll();
});

/* --------------------------------
   Buddy AI
-------------------------------- */

const WORKER_URL =
  "https://proud-term-3a4f.sophiaminion205.workers.dev/";

document.getElementById("chatForm").addEventListener("submit", async event => {
  event.preventDefault();

  const input = document.getElementById("question");
  const button = document.getElementById("sendButton");
  const messages = document.getElementById("chatMessages");
  const question = input.value.trim();

  if (!question) {
    input.focus();
    return;
  }

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = question;
  messages.appendChild(userMessage);

  input.value = "";
  button.disabled = true;

  const loading = document.createElement("div");
  loading.className = "message buddy";
  loading.textContent = t("thinking");
  messages.appendChild(loading);
  messages.scrollTop = messages.scrollHeight;

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({message:question})
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Connection failed");
    }

    loading.textContent = data.reply || t("error");

  } catch (error) {
    loading.textContent = t("error");
    console.error(error);
  } finally {
    button.disabled = false;
    messages.scrollTop = messages.scrollHeight;
    input.focus();
  }
});

/* --------------------------------
   言語切り替え
-------------------------------- */

document.getElementById("languageSelect").addEventListener("change", event => {
  changeLanguage(event.target.value);
});

document.getElementById("languageSelect2").addEventListener("change", event => {
  changeLanguage(event.target.value);
});

/* --------------------------------
   起動アニメーション
-------------------------------- */

const splash = document.getElementById("splash");
const app = document.getElementById("app");
const reduceMotion = window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;

changeLanguage(currentLanguage);
renderAll();

if (reduceMotion) {
  splash.remove();
  app.classList.add("ready");
} else {
  setTimeout(() => {
    splash.classList.add("leaving");
    app.classList.add("ready");
  }, 850);

  setTimeout(() => {
    splash.remove();
  }, 1900);
}
</script>
