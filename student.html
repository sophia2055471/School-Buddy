<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Buddy</title>
<style>
body {
  font-family: sans-serif;
  background: #f4f7fc;
  color: #30415d;
  padding: 20px;
}
header { text-align: center; }
h1 { color: #568cba; }
.card {
  background: white;
  padding: 20px;
  border-radius: 18px;
  margin: 16px auto;
  max-width: 500px;
  box-shadow: 0 4px 15px #e1e8f2;
}
textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border: 1px solid #ccd5e2;
  border-radius: 10px;
  font-size: 16px;
  min-height: 100px;
}
button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #568cba;
  color: white;
  font-size: 16px;
  margin-top: 10px;
}
.menu {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.menu button {
  background: #eaf1fb;
  color: #41678f;
}
#answer {
  background: #f0f5fb;
  padding: 14px;
  border-radius: 10px;
  margin-top: 12px;
  white-space: pre-wrap;
}
</style>
</head>
<body>

<header>
<h1>School Buddy 🌷</h1>
<p>こんにちは！今日も一緒に頑張ろう！</p>
</header>

<div class="card">
<h2>🤖 AIに質問しよう！</h2>
<p>わからないことを自由に入力してね。</p>
<textarea id="question" placeholder="例：この言葉の意味を教えて！"></textarea>
<button onclick="askQuestion()">質問する</button>
<div id="answer">ここに回答が表示されるよ！</div>
</div>

<div class="card">
<h2>📚 学校サポート</h2>
<div class="menu">
<button onclick="showMessage('今日の予定')">📅 今日の予定</button>
<button onclick="showMessage('写真で質問')">📸 写真で質問</button>
<button onclick="showMessage('会話の練習')">💬 会話の練習</button>
<button onclick="showMessage('言葉の意味')">📖 言葉の意味</button>
</div>
<div id="menuAnswer"></div>
</div>

<script>
function askQuestion() {
  const question = document.getElementById("question").value.trim();
  const answer = document.getElementById("answer");

  if (!question) {
    answer.textContent = "質問を入力してね！";
    return;
  }

  let message = "";

  if (question.includes("意味") || question.includes("言葉")) {
    message = "言葉の意味を一緒に考えよう！まず、その言葉が使われている文章を見てみよう。";
  } else if (question.includes("先生") || question.includes("質問")) {
    message = "先生には『〇〇のところがわかりません。もう一度教えてください』と伝えてみよう！";
  } else if (question.includes("宿題") || question.includes("勉強")) {
    message = "大丈夫！まずは問題を一つずつ見てみよう。どこからわからないか探してみよう！";
  } else {
    message = "質問してくれてありがとう！もう少し詳しく教えてくれるかな？";
  }

  answer.textContent = message;
}
  const question = document.getElementById("question").value.trim();
  const answer = document.getElementById("answer");

  if (!question) {
    answer.textContent = "質問を入力してね！";
    return;
  }

  answer.textContent =
    "質問を受け取ったよ！😊\n\n「" + question +
    "」\n\n今は試作品だよ。本物のAI回答機能はこれから追加するね！";
}

function showMessage(name) {
  document.getElementById("menuAnswer").textContent =
    name + " の機能はこれから作っていくよ！";
}
</script>

</body>
</html>
