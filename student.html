<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Buddy - 生徒ホーム</title>
<style>
body {
  font-family: sans-serif;
  background: #f3f7fc;
  color: #26354a;
  margin: 0;
  padding: 24px;
}
h1 { color: #478cbb; }
.card {
  background: white;
  padding: 20px;
  margin: 16px 0;
  border-radius: 18px;
  box-shadow: 0 3px 12px #dce5ef;
}
button {
  background: #478cbb;
  color: white;
  border: none;
  padding: 13px 20px;
  border-radius: 12px;
  font-size: 16px;
}
</style>
</head>
<body>

<h1>School Buddy</h1>
<p>こんにちは！今日も一緒に頑張ろう！</p>



<div class="card">
<h2>📅 今日の予定</h2>
<p>先生から登録された予定を確認できるよ。</p>
<p>現在、予定はありません。</p>
</div>

<div class="card">
<h2>💬 会話の練習</h2>
<p>先生や友達との会話を練習しよう。</p>
<button onclick="alert('会話練習機能はこれから開発します！')">
練習する
</button>
</div>

<div class="card">
<h2>📷 写真で質問</h2>
<p>わからない問題や言葉を写真で質問しよう。</p>
<button onclick="alert('写真質問機能はこれから開発します！')">
写真を選ぶ
</button>
</div>

</body>
</html>
