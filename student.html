
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Buddy Dashboard</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #9586ed;
  color: #29364a;
}

.dashboard {
  display: grid;
  grid-template-columns: 190px minmax(0, 1fr) 220px;
  max-width: 1450px;
  min-height: 90vh;
  margin: 5vh auto;
  background: #fff;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 12px 35px #5144a455;
}

.sidebar {
  padding: 25px 16px;
  border-right: 1px solid #edf0f5;
  display: flex;
  flex-direction: column;
}

.brand {
  font-size: 21px;
  font-weight: bold;
  color: #315fb5;
  margin-bottom: 35px;
}

.nav button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 13px 12px;
  border: none;
  border-radius: 9px;
  background: transparent;
  color: #657184;
  font-size: 14px;
  margin-bottom: 7px;
}

.nav button.active {
  background: #3268c3;
  color: white;
}

.sidebar-bottom {
  margin-top: auto;
  padding-top: 25px;
}

.main {
  background: #f8f9fd;
  padding: 25px;
  min-width: 0;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}

.search {
  width: 65%;
  max-width: 350px;
  padding: 12px;
  border: 1px solid #e1e5ed;
  border-radius: 9px;
}

h1 {
  font-size: 25px;
  margin-bottom: 5px;
}

.muted {
  color: #8994a6;
  font-size: 13px;
}

.hero {
  background: linear-gradient(110deg, #3268b9, #588bd4);
  color: white;
  padding: 24px;
  border-radius: 17px;
  margin-bottom: 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.hero small {
  letter-spacing: 1px;
}

.hero h2 {
  font-size: 21px;
  margin: 12px 0;
}

.hero p {
  font-size: 14px;
}

.buddy-image {
  width: 145px;
  height: 145px;
  object-fit: contain;
  border-radius: 15px;
  flex-shrink: 0;
}

.section-title {
  font-size: 18px;
  margin-bottom: 15px;
}

.card {
  background: white;
  padding: 19px;
  border-radius: 16px;
  margin-bottom: 20px;
  box-shadow: 0 3px 14px #dfe5f055;
}

.shortcuts {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.shortcut {
  padding: 19px 12px;
  border: none;
  border-radius: 12px;
  background: #e6efff;
  color: #315a9c;
  font-size: 14px;
  text-align: left;
  min-height: 70px;
}

.shortcut:nth-child(2) {
  background: #eee7ff;
}

.shortcut:nth-child(3) {
  background: #e1f4eb;
}

.shortcut:nth-child(4) {
  background: #fff0d6;
}

textarea {
  width: 100%;
  min-height: 90px;
  padding: 12px;
  border: 1px solid #dce2ed;
  border-radius: 10px;
  font: inherit;
  resize: vertical;
}

.primary {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  color: white;
  background: #3268c3;
  font-size: 15px;
}

#answer {
  margin-top: 12px;
  padding: 13px;
  background: #f0f4fc;
  border-radius: 10px;
  white-space: pre-wrap;
  line-height: 1.6;
}

.rightbar {
  padding: 25px 17px;
  border-left: 1px solid #edf0f5;
}

.profile {
  text-align: center;
  padding-bottom: 22px;
  border-bottom: 1px solid #edf0f5;
}

.avatar {
  width: 65px;
  height: 65px;
  margin: 15px auto;
  border-radius: 50%;
  background: #e8e3ff;
  display: grid;
  place-items: center;
  font-size: 32px;
}

.progress {
  height: 10px;
  background: #edf0f5;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 10px;
}

.progress-fill {
  width: 65%;
  height: 100%;
  background: #4b82d0;
  border-radius: 20px;
}

.reminder {
  padding: 12px 0;
  border-bottom: 1px solid #edf0f5;
  font-size: 13px;
}

footer {
  text-align: center;
  color: #8994a6;
  font-size: 12px;
  padding: 20px;
}

@media (max-width: 850px) {
  .dashboard {
    grid-template-columns: 150px minmax(0, 1fr);
    margin: 10px;
  }

  .rightbar {
    display: none;
  }

  .main {
    padding: 16px;
  }
}

@media (max-width: 560px) {
  .dashboard {
    display: block;
    margin: 0;
    border-radius: 0;
  }

  .sidebar {
    padding: 12px;
    border-right: none;
    border-bottom: 1px solid #edf0f5;
  }

  .brand {
    margin-bottom: 10px;
  }

  .nav {
    display: flex;
    overflow-x: auto;
    gap: 5px;
  }

  .nav button {
    width: auto;
    white-space: nowrap;
  }

  .sidebar-bottom {
    display: none;
  }

  .hero {
    padding: 16px;
  }

  .hero h2 {
    font-size: 18px;
  }

  .buddy-image {
    width: 105px;
    height: 105px;
  }
}
</style>
</head>

<body>

<div class="dashboard">

  <aside class="sidebar">
    <div class="brand">✦ School Buddy</div>

    <nav class="nav">
      <button class="active" onclick="navigate('Dashboard',this)">▦ ホーム</button>
      <button onclick="navigate('今日の予定',this)">▣ 今日の予定</button>
      <button onclick="navigate('学習サポート',this)">▤ 学習サポート</button>
      <button onclick="navigate('会話の練習',this)">☏ 会話の練習</button>
      <button onclick="navigate('言葉の意味',this)">◉ 言葉の意味</button>
    </nav>

    <div class="sidebar-bottom nav">
      <button onclick="navigate('設定',this)">⚙ 設定</button>
      <button onclick="navigate('ヘルプ',this)">ⓘ ヘルプ</button>
    </div>
  </aside>

  <main class="main">

    <div class="topbar">
      <input class="search" placeholder="⌕ 検索...">
      <span>🔔</span>
    </div>

    <h1>こんにちは！👋</h1>
    <p class="muted">今日も一緒に頑張ろう！</p>

    <section class="hero">
      <div>
        <small>SCHOOL BUDDY</small>
        <h2>あなたの学校生活を<br>もっと楽しく！</h2>
        <p>Buddyと一緒に、一歩ずつ進もう。</p>
      </div>

      <img
        src="./6472D021-8E55-41F0-B297-D98566EC3550.png"
        alt="Buddy"
        class="buddy-image">
    </section>

    <section class="card">
      <h2 class="section-title">✦ 学校サポート</h2>

      <div class="shortcuts">
        <button class="shortcut" onclick="showFeature('今日の予定')">📅 今日の予定</button>
        <button class="shortcut" onclick="showFeature('写真で質問')">📸 写真で質問</button>
        <button class="shortcut" onclick="showFeature('会話の練習')">💬 会話の練習</button>
        <button class="shortcut" onclick="showFeature('言葉の意味')">📖 言葉の意味</button>
      </div>

      <div id="featureMessage" class="muted" style="margin-top:15px"></div>
    </section>

    <section class="card">
      <h2 class="section-title">💬 Buddyに質問しよう</h2>
      <p class="muted">わからないことを自由に入力してね。</p>

      <textarea id="question" placeholder="例：この言葉の意味を教えて！"></textarea>

      <button class="primary" onclick="askQuestion()">質問する →</button>

      <div id="answer">ここに回答が表示されるよ！</div>
    </section>

    <footer>School Buddy © 2026</footer>

  </main>

  <aside class="rightbar">

    <section class="profile">
      <strong>Your Profile</strong>
      <div class="avatar">🤖</div>
      <strong>Buddy</strong>
      <p class="muted">あなたの学習パートナー</p>
    </section>

    <section class="card">
      <h3>Overall Progress</h3>
      <p class="muted">学習サポートの進み具合</p>
      <div class="progress">
        <div class="progress-fill"></div>
      </div>
      <p class="muted">サンプル表示</p>
    </section>

    <section>
      <h3>Reminders</h3>
      <div class="reminder">📅 今日の予定を確認しよう</div>
      <div class="reminder">📚 宿題をチェックしよう</div>
      <div class="reminder">💬 Buddyと話してみよう</div>
    </section>

  </aside>

</div>

<script>
unction navigate(name, button) {
  document.querySelectorAll(".nav button").forEach(item => {
    item.classList.r
function showFeature(name) {
  document.getElementById("featureMessage").textContent =
    name + " の機能は準備中だよ！";
}

async function askQuestion() {
  const question = document.getElementById("question").value.trim();
  const answer = document.getElementById("answer");

  if (!question) {
    answer.textContent = "質問を入力してね！";
    return;
  }

  answer.textContent = "Buddyが考えているよ... ✨";

  try {
    const response = await fetch("https://proud-term-3a4f.sophiaminion205.workers.dev/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: question
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "接続に失敗したよ");
    }

    answer.textContent = data.reply;

  } catch (error) {
    answer.textContent =
      "ごめんね！AIに接続できなかったよ。もう一度試してね。";
    console.error(error);
  }
}
