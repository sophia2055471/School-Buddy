
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Buddy</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #F7F8FA;
  color: #29364A;
}

header {
  padding: 25px 20px;
  text-align: center;
}

.logo {
  color: #568CBA;
  font-size: 25px;
  font-weight: bold;
}

.subtitle {
  color: #8491A3;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 15px;
}

.welcome {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  flex-wrap: wrap;
  background: linear-gradient(120deg, #DCEEFF, #EDE7FF);
  border-radius: 24px;
  padding: 25px;
  margin-bottom: 20px;
}

.welcome-text {
  flex: 1;
  min-width: 180px;
}

.welcome h2 {
  font-size: 25px;
  margin-top: 0;
}

.buddy-image {
  width: 180px;
  max-width: 45%;
  height: auto;
  object-fit: contain;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 20px;
  margin-bottom: 20px;
  box-shadow: 0 4px 15px #E8EDF4;
}

textarea {
  width: 100%;
  min-height: 110px;
  padding: 14px;
  border: 1px solid #D6DEEA;
  border-radius: 12px;
  font-size: 16px;
  resize: vertical;
}

button {
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 15px;
  cursor: pointer;
}

.ask-button {
  width: 100%;
  margin-top: 12px;
  background: #568CBA;
  color: white;
}

.menu {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.menu button {
  background: #EAF1FB;
  color: #41678F;
  min-height: 65px;
}

.menu button:nth-child(2) {
  background: #F0EAFE;
}

.menu button:nth-child(3) {
  background: #E5F5ED;
}

.menu button:nth-child(4) {
  background: #FFF3D6;
}

#answer, #menuAnswer {
  background: #F0F5FB;
  border-radius: 12px;
  padding: 14px;
  margin-top: 15px;
  line-height: 1.7;
  white-space: pre-wrap;
}

footer {
  text-align: center;
  padding: 25px;
  color: #98A2B3;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <div class="logo">School Buddy 🌷</div>
  <p class="subtitle">Your school life, made easier.</p>
</header>

<main class="container">

  <section class="welcome">
    <div class="welcome-text">
      <h2>こんにちは！👋</h2>
      <p>今日も一緒に頑張ろう！</p>
      <p><strong>Buddyがあなたをサポートするよ。</strong></p>
    </div>

    <img
      src="buddy.png"
      alt="School BuddyのキャラクターBuddy"
      class="buddy-image">
  </section>

  <section class="card">
    <h2>💬 Buddyに質問しよう</h2>
    <p>わからないことを自由に入力してね。</p>

    <textarea id="question"
      placeholder="例：この言葉の意味を教えて！"></textarea>

    <button class="ask-button" onclick="askQuestion()">
      質問する →
    </button>

    <div id="answer">
      ここにBuddyからの回答が表示されるよ！
    </div>
  </section>

  <section class="card">
    <h2>📚 学校サポート</h2>
    <p>使いたい機能を選んでね。</p>

    <div class="menu">
      <button onclick="showMessage('今日の予定')">
        📅 今日の予定
      </button>

      <button onclick="showMessage('写真で質問')">
        📸 写真で質問
      </button>

      <button onclick="showMessage('会話の練習')">
        💬 会話の練習
      </button>

      <button onclick="showMessage('言葉の意味')">
        📖 言葉の意味
      </button>
    </div>

    <div id="menuAnswer">
      選んだ機能の案内がここに表示されるよ！
    </div>
  </section>

</main>

<footer>
  School Buddy © 2026
</footer>

<script>
function askQuestion() {
  const question =
    document.getElementById("question").value.trim();

  const answer = document.getElementById("answer");

  if (!question) {
    answer.textContent = "質問を入力してね！";
    return;
  }

  let message = "";

  if (question.includes("意味") || question.includes("言葉")) {
    message =
      "言葉の意味を一緒に考えよう！\nまず、その言葉が使われている文章を見てみよう。";
  } else if (question.includes("先生") || question.includes("質問")) {
    message =
      "先生には『〇〇のところがわかりません。もう一度教えてください』と伝えてみよう！";
  } else if (question.includes("宿題") || question.includes("勉強")) {
    message =
      "大丈夫！まずは問題を一つずつ見てみよう。";
  } else {
    message =
      "質問してくれてありがとう！\nもう少し詳しく教えてくれるかな？";
  }

  answer.textContent = message;
}

function showMessage(name) {
  const area = document.getElementById("menuAnswer");

  const messages = {
    "今日の予定": "今日の予定を確認する機能を準備中だよ！",
    "写真で質問": "教科書やプリントの写真から質問できる機能を準備中だよ！",
    "会話の練習": "先生や友達との会話を練習できる機能を準備中だよ！",
    "言葉の意味": "難しい言葉をやさしく説明する機能を準備中だよ！"
  };

  area.textContent = messages[name];
}
</script>

</body>
</html>
