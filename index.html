
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f8fc">
<title>School Buddy 2.0</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f8fc;
  color: #29364a;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 24px 7%;
}

.logo {
  font-size: 23px;
  font-weight: 700;
}

.logo span { color: #8d7bea; }

select {
  padding: 10px 14px;
  border: 1px solid #e5e5ef;
  border-radius: 12px;
  background: white;
  color: #29364a;
  font-size: 14px;
}

main {
  max-width: 850px;
  margin: 65px auto;
  padding: 20px;
  text-align: center;
}

.badge {
  display: inline-block;
  padding: 9px 16px;
  border-radius: 30px;
  background: #efedff;
  color: #7667c9;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1.3px;
}

h1 {
  font-size: clamp(36px, 7vw, 58px);
  line-height: 1.15;
  margin: 24px 0 15px;
  letter-spacing: -1.5px;
}

.description {
  color: #858da0;
  font-size: 16px;
  line-height: 1.8;
}

.roles {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
  margin: 48px auto;
  max-width: 650px;
}

.role {
  display: block;
  background: white;
  padding: 35px 20px;
  border-radius: 24px;
  text-decoration: none;
  color: #29364a;
  box-shadow: 0 8px 30px rgba(50, 55, 90, .06);
  transition: transform .2s, box-shadow .2s;
}

.role:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 35px rgba(50, 55, 90, .1);
}

.emoji {
  font-size: 35px;
  margin-bottom: 15px;
}

.role h2 {
  font-size: 20px;
  margin: 0 0 9px;
}

.role p {
  color: #9299a9;
  font-size: 13px;
  margin: 0;
}

footer {
  text-align: center;
  padding: 25px;
  color: #a0a5b2;
  font-size: 12px;
}

@media (max-width: 520px) {
  header { padding: 20px; }
  main { margin: 45px auto; }
  .roles { grid-template-columns: 1fr; }
  .role { padding: 27px 15px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">School <span>Buddy.</span></div>

  <select id="language" onchange="setLanguage(this.value)" aria-label="Language">
    <option value="en">English</option>
    <option value="ja">日本語</option>
    <option value="ko">한국어</option>
    <option value="zh">中文</option>
    <option value="fr">Français</option>
    <option value="es">Español</option>
    <option value="de">Deutsch</option>
    <option value="pt">Português</option>
  </select>
</header>

<main>
  <div class="badge" id="badge">YOUR LEARNING COMPANION</div>

  <h1 id="heading">School can be<br>easier together.</h1>

  <p class="description" id="description">
    A little support, a little guidance, and a better school day.
  </p>

  <div class="roles">

    <a class="role" href="login.html?role=student">
      <div class="emoji">🎒</div>
      <h2 id="studentTitle">I'm a Student</h2>
      <p id="studentDescription">My personal learning space</p>
    </a>

    <a class="role" href="login.html?role=teacher">
      <div class="emoji">📚</div>
      <h2 id="teacherTitle">I'm a Teacher</h2>
      <p id="teacherDescription">My teaching workspace</p>
    </a>

  </div>
</main>

<footer id="footer">
  Learn, Communicate, and Grow.
</footer>

<script>
const translations = {
  en: {
    badge:"YOUR LEARNING COMPANION",
    heading:"School can be<br>easier together.",
    description:"A little support, a little guidance, and a better school day.",
    student:"I'm a Student",
    studentDesc:"My personal learning space",
    teacher:"I'm a Teacher",
    teacherDesc:"My teaching workspace",
    footer:"Learn, Communicate, and Grow."
  },
  ja: {
    badge:"あなたの学習パートナー",
    heading:"学校生活を、<br>もっと一緒に。",
    description:"ちょっとしたサポートで、毎日の学校生活をもっと過ごしやすく。",
    student:"生徒です",
    studentDesc:"自分専用の学習スペース",
    teacher:"先生です",
    teacherDesc:"先生専用のワークスペース",
    footer:"学び、つながり、成長しよう。"
  },
  ko: {
    badge:"당신의 학습 파트너",
    heading:"학교생활을<br>함께 더 편하게.",
    description:"작은 도움으로 더 나은 학교생활을 만들어 보세요.",
    student:"학생입니다",
    studentDesc:"나만의 학습 공간",
    teacher:"선생님입니다",
    teacherDesc:"선생님 전용 공간",
    footer:"배우고, 소통하고, 성장하세요."
  },
  zh: {
    badge:"你的学习伙伴",
    heading:"让校园生活<br>变得更轻松。",
    description:"一点支持，一点引导，让校园生活更美好。",
    student:"我是学生",
    studentDesc:"我的个人学习空间",
    teacher:"我是老师",
    teacherDesc:"我的教学工作空间",
    footer:"学习、交流、成长。"
  },
  fr: {
    badge:"VOTRE PARTENAIRE D'APPRENTISSAGE",
    heading:"L'école est plus<br>facile ensemble.",
    description:"Un peu de soutien pour une meilleure journée scolaire.",
    student:"Je suis élève",
    studentDesc:"Mon espace d'apprentissage",
    teacher:"Je suis enseignant",
    teacherDesc:"Mon espace de travail",
    footer:"Apprendre, communiquer et grandir."
  },
  es: {
    badge:"TU COMPAÑERO DE APRENDIZAJE",
    heading:"La escuela es mejor<br>cuando estamos juntos.",
    description:"Un poco de apoyo para un mejor día escolar.",
    student:"Soy estudiante",
    studentDesc:"Mi espacio de aprendizaje",
    teacher:"Soy profesor",
    teacherDesc:"Mi espacio de trabajo",
    footer:"Aprender, comunicar y crecer."
  },
  de: {
    badge:"DEIN LERNBEGLEITER",
    heading:"Gemeinsam wird<br>Schule leichter.",
    description:"Ein wenig Unterstützung für einen besseren Schultag.",
    student:"Ich bin Schüler",
    studentDesc:"Mein persönlicher Lernbereich",
    teacher:"Ich bin Lehrer",
    teacherDesc:"Mein Arbeitsbereich",
    footer:"Lernen, kommunizieren und wachsen."
  },
  pt: {
    badge:"SEU PARCEIRO DE APRENDIZAGEM",
    heading:"A escola fica melhor<br>quando estamos juntos.",
    description:"Um pouco de apoio para um dia escolar melhor.",
    student:"Sou estudante",
    studentDesc:"Meu espaço de aprendizagem",
    teacher:"Sou professor",
    teacherDesc:"Meu espaço de trabalho",
    footer:"Aprender, comunicar e crescer."
  }
};

function setLanguage(lang) {
  const t = translations[lang] || translations.en;
  document.documentElement.lang = lang;

  document.getElementById("badge").textContent = t.badge;
  document.getElementById("heading").innerHTML = t.heading;
  document.getElementById("description").textContent = t.description;
  document.getElementById("studentTitle").textContent = t.student;
  document.getElementById("studentDescription").textContent = t.studentDesc;
  document.getElementById("teacherTitle").textContent = t.teacher;
  document.getElementById("teacherDescription").textContent = t.teacherDesc;
  document.getElementById("footer").textContent = t.footer;

  localStorage.setItem("schoolBuddyLanguage", lang);
}

const savedLanguage = localStorage.getItem("schoolBuddyLanguage") || "en";
document.getElementById("language").value = savedLanguage;
setLanguage(savedLanguage);
</script>

</body>
</html>
