
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Buddy</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f3f7fc;
      color: #26354a;
      text-align: center;
      padding: 40px 20px;
    }
    .logo {
      font-size: 38px;
      font-weight: bold;
      color: #478cbb;
      margin-top: 45px;
    }
    .subtitle {
      color: #718096;
      margin-bottom: 45px;
    }
    .choice {
      display: block;
      width: 100%;
      max-width: 360px;
      margin: 18px auto;
      padding: 25px;
      border: none;
      border-radius: 18px;
      font-size: 21px;
      font-weight: bold;
      background: white;
      color: #397eaa;
      box-shadow: 0 3px 12px #dce5ef;
    }
    .choice:active {
      background: #e5f1fc;
    }
  </style>
</head>
<body>

  <div class="logo">School Buddy</div>
  <p class="subtitle">あなたの学校生活をサポートします</p>

  <h2>こんにちは！</h2>
  <p>あなたはどちらですか？</p>

  <button class="choice" onclick="alert('生徒用画面はこれから作ります！')">
    🎒 生徒
  </button>

  <button class="choice" onclick="alert('先生用画面はこれから作ります！')">
    📚 先生
  </button>

  <p class="subtitle">Learn, Communicate, and Grow.</p>

</body>
</html>
