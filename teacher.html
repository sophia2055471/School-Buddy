
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Buddy 先生用</title>
<style>
body {
  font-family: sans-serif;
  background: #f3f7fc;
  padding: 20px;
  color: #26354a;
}
h1 { color: #8260ad; }
.card {
  background: white;
  padding: 20px;
  border-radius: 18px;
  margin: 18px 0;
}
input, textarea {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}
button {
  background: #8260ad;
  color: white;
  border: 0;
  padding: 14px;
  border-radius: 12px;
  font-size: 16px;
}
</style>
</head>
<body>

<h1>School Buddy 📚</h1>
<p>先生専用ページ</p>

<div class="card">
<h2>📅 今日の予定を登録</h2>

<input type="date" id="date">
<input type="text" id="schedule" placeholder="授業・予定">
<textarea id="instruction" placeholder="先生からの指示"></textarea>

<button onclick="saveSchedule()">予定を保存する</button>
<p id="message"></p>
</div>

<div class="card">
<h2>📋 保存した予定</h2>
<div id="saved"></div>
</div>

<script>
function saveSchedule() {
  const date = document.getElementById("date").value;
  const schedule = document.getElementById("schedule").value;
  const instruction = document.getElementById("instruction").value;

  if (!date || !schedule || !instruction) {
    alert("全部入力してね！");
    return;
  }

  const data = {
    date,
    schedule,
    instruction
  };

  localStorage.setItem("schoolBuddySchedule", JSON.stringify(data));

  document.getElementById("message").textContent =
    "予定を保存しました！🎉";

  showSchedule();
}

function showSchedule() {
  const data = JSON.parse(
    localStorage.getItem("schoolBuddySchedule") || "null"
  );

  const saved = document.getElementById("saved");

  if (!data) {
    saved.textContent = "まだ予定はありません。";
    return;
  }

  saved.textContent =
    data.date + " ／ " + data.schedule + " ／ " + data.instruction;
}

showSchedule();
</script>

</body>
</html>
