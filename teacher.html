
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Buddy - 先生用</title>
<style>
body {
  font-family: sans-serif;
  background: #f3f7fc;
  color: #26354a;
  padding: 24px;
}
h1 { color: #8260ad; }
.card {
  background: white;
  padding: 20px;
  margin: 18px 0;
  border-radius: 18px;
}
input, textarea {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}
button {
  background: #8260ad;
  color: white;
  border: none;
  padding: 14px;
  border-radius: 12px;
  font-size: 16px;
}
</style>
</head>
<body>

<h1>School Buddy 📚</h1>
<p>先生用ホーム画面</p>

<div class="card">
<h2>📅 今日の予定を登録</h2>

<label>日付</label>
<input type="date" id="date">

<label>授業・予定</label>
<input type="text" id="schedule" placeholder="例：数学の授業">

<label>先生からの指示</label>
<textarea id="instruction" rows="4"
placeholder="今日やることや注意点を入力"></textarea>

<button onclick="registerSchedule()">登録する</button>
<p id="result"></p>
</div>

<div class="card">
<h2>📋 登録内容の確認</h2>
<div id="preview">まだ予定は登録されていません。</div>
</div>

<script>
function registerSchedule() {
  const date = document.getElementById("date").value;
  const schedule = document.getElementById("schedule").value;
  const instruction = document.getElementById("instruction").value;

  if (!date || !schedule || !instruction) {
    alert("すべて入力してください。");
    return;
  }

  const preview = document.getElementById("preview");
  preview.textContent =
    date + " ／ " + schedule + " ／ " + instruction;

  document.getElementById("result").textContent =
    "登録内容を画面に表示しました！";
}
</script>

</body>
</html>
