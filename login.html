
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f8fc">
<title>Login | School Buddy 2.0</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #f7f8fc;
  color: #29364a;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
}

.container {
  width: 100%;
  max-width: 440px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.logo {
  font-size: 23px;
  font-weight: 700;
}

.logo span { color: #8b7bea; }

select, input {
  width: 100%;
  padding: 14px;
  border: 1px solid #e4e6ee;
  border-radius: 12px;
  background: #fbfbfd;
  color: #29364a;
  font-size: 15px;
}

#language {
  width: auto;
  padding: 10px;
  background: white;
}

.card {
  background: white;
  border-radius: 24px;
  padding: 32px;
  box-shadow: 0 10px 35px rgba(50,55,90,.07);
}

h1 {
  font-size: 26px;
  margin: 0 0 8px;
  text-align: center;
}

.subtitle {
  text-align: center;
  color: #8991a2;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 25px;
}

.role-label {
  text-align: center;
  color: #8273d7;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1px;
  margin-bottom: 18px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin: 16px 0 8px;
}

input:focus, select:focus {
  outline: none;
  border-color: #9788ec;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 13px;
  background: #8d7bea;
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 18px;
}

.secondary {
  background: #f0edff;
  color: #695bb5;
  margin-top: 12px;
}

.text-button, .back {
  background: none;
  color: #8171d5;
  padding: 10px;
  margin-top: 10px;
}

.hidden { display: none !important; }

.message {
  text-align: center;
  color: #9299a9;
  font-size: 12px;
  line-height: 1.6;
  margin-top: 22px;
}

.notice {
  background: #f7f5ff;
  color: #7164b5;
  border-radius: 12px;
  padding: 12px;
  font-size: 12px;
  line-height: 1.6;
  margin-top: 16px;
}

.password-box {
  position: relative;
}

.password-box input {
  padding-right: 55px;
}

.eye-button {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: auto;
  margin: 0;
  padding: 8px;
  background: transparent;
  color: #8171d5;
}

@media(max-width:420px) {
  .card { padding: 25px 20px; }
  .logo { font-size: 20px; }
}
</style>
</head>

<body>
<div class="container">

  <div class="top">
    <div class="logo">School <span>Buddy.</span></div>

    <select id="language" aria-label="Language">
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="zh">中文</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
      <option value="de">Deutsch</option>
      <option value="pt">Português</option>
    </select>
  </div>

  <div class="card">

    <div class="role-label" id="roleLabel"></div>

    <!-- LOGIN METHOD -->
    <section id="methodScreen">
      <h1 id="welcome"></h1>
      <p class="subtitle" id="methodSubtitle"></p>

      <button onclick="showLogin('email')" id="emailButton"></button>
      <button class="secondary" onclick="showLogin('school')" id="schoolButton"></button>
      <button class="secondary" onclick="googleNotice()" id="googleButton"></button>
      <button class="text-button" onclick="showRegister()" id="createButton"></button>
      <button class="back" onclick="goHome()" id="homeButton"></button>
    </section>

    <!-- LOGIN -->
    <section id="loginScreen" class="hidden">
      <h1 id="loginTitle"></h1>
      <p class="subtitle" id="loginSubtitle"></p>

      <form onsubmit="demoSubmit(event,'login')">
        <label id="loginIdLabel"></label>
        <input id="loginId" type="email" required>

        <label id="passwordLabel"></label>

        <div class="password-box">
          <input id="loginPassword" type="password" required>
          <button type="button" class="eye-button"
            onclick="togglePassword()" aria-label="Show password">👁️</button>
        </div>

        <button type="submit" id="loginButton"></button>
        <button type="button" class="text-button"
          onclick="showForgotPassword()" id="forgotButton"></button>
      </form>

      <button class="back" onclick="backToMethods()" id="backButton"></button>
    </section>

    <!-- FORGOT PASSWORD -->
    <section id="forgotScreen" class="hidden">
      <h1 id="forgotTitle"></h1>
      <p class="subtitle" id="forgotSubtitle"></p>

      <form onsubmit="demoSubmit(event,'forgot')">
        <label id="forgotEmailLabel"></label>
        <input id="forgotEmail" type="email" required>
        <button type="submit" id="resetButton"></button>
      </form>

      <button class="back" onclick="backToLogin()" id="forgotBack"></button>
    </section>

    <!-- REGISTER -->
    <section id="registerScreen" class="hidden">
      <h1 id="registerTitle"></h1>
      <p class="subtitle" id="registerSubtitle"></p>

      <form onsubmit="demoSubmit(event,'register')">
        <label id="nicknameLabel"></label>
        <input type="text" id="nicknameInput" required>

        <label id="registerEmailLabel"></label>
        <input type="email" id="registerEmailInput" required>

        <label id="registerPasswordLabel"></label>
        <input type="password" id="registerPasswordInput" required>

        <label id="gradeLabel"></label>
        <select id="gradeSelect" required>
          <option value="" id="gradePlaceholder"></option>
          <option value="1" id="grade1"></option>
          <option value="2" id="grade2"></option>
          <option value="3" id="grade3"></option>
          <option value="other" id="gradeOther"></option>
        </select>

        <label id="classLabel"></label>
        <input type="text" id="classInput" required>

        <label id="tempPasswordLabel"></label>
        <input type="text" id="tempPasswordInput">

        <button type="submit" id="registerButton"></button>
      </form>

      <div class="notice" id="registerNotice"></div>
      <button class="back" onclick="backToMethods()" id="registerBack"></button>
    </section>

    <p class="message" id="message"></p>
  </div>
</div>

let currentLang = localStorage.getItem("schoolBuddyLanguage") || "en";

function showScreen(id) {
  screens.forEach(screen => {
    document.getElementById(screen).classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");
}

function showLogin(method) {
  showScreen("loginScreen");

  const t = translations[currentLang];
  const label = document.getElementById("loginIdLabel");
  const input = document.getElementById("loginId");

  label.textContent = method === "school" ? t.schoolId : t.email;
  input.type = method === "school" ? "text" : "email";
  input.placeholder = method === "school" ? t.schoolId : "you@example.com";

  document.getElementById("loginSubtitle").textContent = t.loginSubtitle;
}

function showRegister() {
  showScreen("registerScreen");
}

function showForgotPassword() {
  showScreen("forgotScreen");
}

function backToLogin() {
  showScreen("loginScreen");
}

function backToMethods() {
  showScreen("methodScreen");
}

function goHome() {
  location.href = "index.html";
}

function googleNotice() {
  alert(translations[currentLang].googleNotice);
}

function togglePassword() {
  const input = document.getElementById("loginPassword");
  input.type = input.type === "password" ? "text" : "password";
}

async function demoSubmit(event, type) {
  event.preventDefault();

  const t = translations[currentLang];

  try {
    if (type === "register") {
      const email = document.getElementById("registerEmailInput").value.trim();
      const password = document.getElementById("registerPasswordInput").value;

      await createUserWithEmailAndPassword(auth, email, password);

      alert("Account created successfully!");
      showScreen("loginScreen");

    } else if (type === "forgot") {
      const email = document.getElementById("forgotEmail").value.trim();

      await sendPasswordResetEmail(auth, email);

      alert("Password reset email sent!");

    } else if (type === "login") {
      const email = document.getElementById("loginId").value.trim();
      const password = document.getElementById("loginPassword").value;

      await signInWithEmailAndPassword(auth, email, password);

      alert("Login successful!");
    }

  } catch (error) {
    console.error(error);
    alert("Something went wrong: " + error.message);
  }
}

    tempPasswordLabel:"tempPassword",
    registerButton:"registerButton",
    registerNotice:"registerNotice",
    registerBack:"back",
    message:"message"
  };

  Object.entries(textMap).forEach(([id,key]) => {
    document.getElementById(id).textContent = t[key];
  });

  document.getElementById("roleLabel").textContent =
    selectedRole === "teacher" ? t.teacherRole : t.role;

  document.getElementById("loginId").placeholder = t.email;
  document.getElementById("forgotEmail").placeholder = t.email;
  document.getElementById("nicknameInput").placeholder = t.nickname;
  document.getElementById("registerEmailInput").placeholder = t.email;
  document.getElementById("registerPasswordInput").placeholder = t.registerPassword;
  document.getElementById("classInput").placeholder = t.className;
  document.getElementById("tempPasswordInput").placeholder = t.tempPlaceholder;

  localStorage.setItem("schoolBuddyLanguage", currentLang);
}

document.getElementById("language").addEventListener("change", event => {
  setLanguage(event.target.value);
});

setLanguage(currentLang);
showScreen("methodScreen");
</script>

</body>
